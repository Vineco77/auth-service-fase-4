# sonar-project.properties
sonar.projectKey=Vineco77_auth-service-fase-4
sonar.projectName=auth-service-fase-4
sonar.organization=vineco77

# === CÓDIGO-FONTE (exclui testes) ===
sonar.sources=src
sonar.exclusions=**/node_modules/**, dist/**, build/**, **/*.d.ts, **/*.spec.ts, **/*.test.ts

# === EXCLUSÕES DE COBERTURA (DTOs, Enums, Interfaces, Bootstrap) ===
sonar.coverage.exclusions=**/*.dto.ts, **/*.enum.ts, **/value-objects/**, **/main.ts

# === ARQUIVOS DE TESTE (inclui apenas testes) ===
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# === CONFIGURAÇÕES TÉCNICAS ===
sonar.language=ts
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info