name: CI/CD with SonarCloud

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: 'us-east-1'
  LAMBDA_FUNCTION_NAME: 'cpf-cognito-lambda-handler'
  NODE_VERSION: '18.x'

jobs:
  # JOB 1: Análise de Qualidade com SonarCloud
  quality-analysis:
    name: 🛡️ Quality Analysis with SonarCloud
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important for SonarCloud analysis

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Instalar dependências
      run: |
        npm ci
        npm install --save-dev jest jest-sonar-reporter

    - name: Executar testes com cobertura
      run: |
        echo "🧪 Executando testes com cobertura..."
        npm run test:ci
        echo "✅ Testes concluídos!"

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=Vineco77_auth-service-fase-4
          -Dsonar.organization=vineco77
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          -Dsonar.coverage.exclusions=**/handlers/**,**/node_modules/**,**/*.test.js
          -Dsonar.qualitygate.wait=true

  # JOB 2: Deploy para AWS Lambda (SÓ SE QUALITY GATE PASSAR)
  deploy-lambda:
    name: 🚀 Deploy to AWS Lambda
    runs-on: ubuntu-latest
    needs: quality-analysis  # ⚠️ SÓ EXECUTA SE QUALITY-ANALYSIS PASSAR
    if: github.ref == 'refs/heads/main' && needs.quality-analysis.result == 'success'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Configurar AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Criar .env dinamicamente
      run: |
        echo "🔧 Criando .env..."
        cat > .env << EOF
        COGNITO_USER_POOL_ID=${{ secrets.COGNITO_USER_POOL_ID }}
        COGNITO_CLIENT_ID=${{ secrets.COGNITO_CLIENT_ID }}
        NODE_ENV=production
        AWS_REGION=us-east-1
        EOF
        echo "✅ .env criado com sucesso!"

    - name: Instalar dependências e empacotar Lambda
      run: |
        npm ci --production
        zip -r function.zip src/ node_modules/ package.json .env
        echo "📦 Package criado: function.zip"

    - name: Deploy para Lambda
      run: |
        echo "🚀 Fazendo deploy para AWS Lambda..."
        aws lambda update-function-code \
          --function-name $LAMBDA_FUNCTION_NAME \
          --zip-file fileb://function.zip \
          --region ${{ env.AWS_REGION }}
        echo "✅ Deploy concluído com sucesso!"

    - name: Verificar deploy
      run: |
        echo "🔍 Verificando status da Lambda..."
        aws lambda get-function --function-name $LAMBDA_FUNCTION_NAME --region ${{ env.AWS_REGION }} --query 'Configuration.LastUpdateStatus' --output text
        echo "✅ Lambda atualizada com sucesso!"