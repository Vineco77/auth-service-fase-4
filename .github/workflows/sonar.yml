name: SonarQube Analysis
on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: 🔬 Enforce 80% Test Coverage per File
        id: coverage-check
        run: |
          echo "Running tests and checking coverage per file..."
          
          # 1. Gera o relatório de cobertura em formato JSON
          npm test -- --coverage --coverageReporters=json-summary --coverageReporters=lcov
          
          # 2. Analisa CADA ARQUIVO no relatório
          FAILED_FILES=$(node -e "
            const report = require('./coverage/coverage-summary.json');
            const minCoverage = 80;
            let failed = [];
            
            for (const [filePath, data] of Object.entries(report)) {
              // Ignora o total e arquivos que não são do nosso src
              if (filePath === 'total' || !filePath.includes('src/')) continue;
              
              // Ignora DTOs, Enums, Value Objects, Interfaces e Bootstrap
              if (filePath.endsWith('.dto.ts') || 
                  filePath.endsWith('.enum.ts') || 
                  filePath.includes('/value-objects/') ||
                  filePath.endsWith('.interface.ts') ||
                  filePath.endsWith('/main.ts')) continue;
              
              const lineCoverage = data.lines.pct;
              if (lineCoverage < minCoverage) {
                failed.push(\`\${filePath}: \${lineCoverage}%\`);
              }
            }
            
            if (failed.length > 0) {
              console.log('❌ Arquivos com cobertura insuficiente:');
              failed.forEach(f => console.log(\`  \${f}\`));
              process.exit(1); // Falha a pipeline
            } else {
              console.log('✅ Todos os arquivos atendem 80% de cobertura!');
              process.exit(0);
            }
          ")
          
          # 3. Se o Node sair com código 1, este comando não será executado
          echo "✅ Verificação de cobertura por arquivo concluída com sucesso."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}